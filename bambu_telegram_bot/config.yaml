name: "Bambu Telegram Monitor"
version: "2.0.0"
slug: "bambu_telegram_monitor"
description: "Monitors Bambu Lab A1/P1/X1 printers and sends Telegram notifications. Supports Spoolman, HA camera, light control, and remote print management."
url: "https://github.com/raziel6453/bambu_telegram_bot"
arch:
  - aarch64
  - amd64
  - armv7
init: false
homeassistant_api: true
map:
  - config:rw
options:
  printer_ip: "192.168.1.50"
  printer_serial: "01P00A123456789"
  printer_password: "YOUR_PRINTER_ACCESS_CODE"
  bambu_username: "user@example.com"
  bambu_password: "YOUR_BAMBU_ACCOUNT_PASS"
  telegram_token: "YOUR_TELEGRAM_BOT_TOKEN"
  telegram_chat_id: "YOUR_CHAT_ID"
  spoolman_url: ""
  ha_camera_entity: ""
  ha_light_entity: ""
  ha_weight_entity: ""
  low_stock_threshold: 100
  language: "he"
schema:
  printer_ip: str
  printer_serial: str
  printer_password: str
  bambu_username: str
  bambu_password: password
  telegram_token: str
  telegram_chat_id: str
  spoolman_url: str?
  ha_camera_entity: str?
  ha_light_entity: str?
  ha_weight_entity: str?
  low_stock_threshold: int?
  language: "list(he|en)"
